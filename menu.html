<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<meta name="description" content="海鮮料理 ながひろのお品書き。ランチ、夜の御膳、コース、単品料理、お飲み物をご案内します。">
<title>お品書き｜海鮮料理 ながひろ</title>
<style>
:root{--gold:#c8a35a;--cream:#f8f0e4;--muted:#c9bda8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#090909;color:var(--cream);font-family:"Yu Mincho","Hiragino Mincho ProN",serif;line-height:1.7;letter-spacing:.04em}
header{padding:26px 16px 20px;text-align:center;border-bottom:1px solid #735a30;background:linear-gradient(#17130d,#090909)}
.brand{font-size:13px;letter-spacing:.3em;color:var(--gold)}
h1{font-size:27px;font-weight:400;letter-spacing:.2em;margin:4px 0}
.sub{font-size:11px;color:var(--muted);letter-spacing:.18em}
nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:12px;background:#111;border-bottom:1px solid #594523}
nav a{white-space:nowrap;color:#e8d6b1;text-decoration:none;border:1px solid #806437;border-radius:20px;padding:6px 13px;font-size:12px}
main{max-width:960px;margin:auto;padding:8px 14px 48px}
section{padding:30px 0 8px;scroll-margin-top:65px}
h2{text-align:center;color:#e8c67a;font-size:21px;font-weight:400;letter-spacing:.2em;margin:0 0 7px}
.en{text-align:center;color:#a88a54;font-size:10px;letter-spacing:.3em;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#15130f;border:1px solid #6b542e;padding:10px;min-width:0}
.card img{width:100%;height:145px;object-fit:cover;display:block;background:#211d16}
.card h3{font-size:17px;font-weight:400;color:#f0d69d;margin:9px 0 2px}
.desc{font-size:12px;color:#c9bda8;min-height:2.8em;margin:0 0 6px}
.price{font-size:17px;color:#fff0cf;text-align:right}
.price small{font-size:11px;color:#bda77e}
.note{font-size:11px;color:#c9bda8;margin-top:14px;padding:12px;border:1px solid #514126}
.menu-sheet{border:1px solid #6b542e;background:#17130d;padding:8px;margin:10px 0 18px}
.menu-sheet img{width:100%;height:auto;display:block}
.sheet-title{font-size:13px;color:#e8c67a;margin:0 0 8px}
footer{text-align:center;padding:26px 12px;color:#bba77f;border-top:1px solid #5c4829;font-size:12px}
#load-error{max-width:760px;margin:30px auto;padding:16px;border:1px solid #8a513e;color:#ffe1d5;text-align:center}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.card img{height:160px}}
</style>
</head>
<body>
<header><div class="brand">海鮮料理</div><h1>ながひろ お品書き</h1><div class="sub">四季の海鮮と、和のひととき。</div></header>
<nav>
<a href="#lunch">ランチ</a><a href="#night">夜の御膳</a><a href="#course">コース</a><a href="#single">単品</a><a href="#drink">お飲み物</a>
</nav>
<main id="menu-main">
<div id="load-error" hidden>メニューを読み込めませんでした。時間をおいて再度お試しください。</div>
</main>
<footer>海鮮料理 ながひろ<br>福岡県田川市夏吉453-2 雅の杜<br>営業時間 昼 11:30〜14:00／夜 17:30〜22:00<br><a href="tel:0947423660" style="color:#e8c67a">ご予約 0947-42-3660</a></footer>
<script>
const sections=[
 {id:"lunch",title:"ランチメニュー",en:"LUNCH"},
 {id:"night",title:"夜のこだわり御膳",en:"NIGHT SET MEAL"},
 {id:"course",title:"推奨コース料理",en:"COURSE"},
 {id:"single",title:"単品メニュー",en:"A LA CARTE"},
 {id:"drink",title:"お飲み物",en:"DRINK"}
];
function parseCSV(text){
 const rows=[];let row=[],cell="",quoted=false;
 for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];
  if(c==='"'&&quoted&&n==='"'){cell+='"';i++;}
  else if(c==='"'){quoted=!quoted;}
  else if(c===','&&!quoted){row.push(cell);cell="";}
  else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(v=>v!==""))rows.push(row);row=[];cell="";}
  else cell+=c;
 }
 if(cell!==""||row.length){row.push(cell);rows.push(row);}
 const headerMap={"種類":"type","分類":"category","料理名":"name","説明":"description","通常価格（税込）":"price","土日祝価格（税込）":"holiday_price","写真ファイル":"image","表示順":"sort"};
 const typeMap={"料理":"item","紙メニュー":"sheet","注意書き":"note"};
 const categoryMap={"ランチ":"lunch","夜の御膳":"night","コース料理":"course","単品料理":"single","お飲み物":"drink"};
 const headers=(rows.shift()||[]).map(h=>headerMap[h.trim().replace(String.fromCharCode(65279),"")]||h.trim());
 return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]||"").trim()])).map(([k,v])=>[k,k==="type"?(typeMap[v]||v):k==="category"?(categoryMap[v]||v):v]));
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function yen(v){const n=Number(v);return Number.isFinite(n)&&n>0?n.toLocaleString("ja-JP")+"円":"";}
function safeImage(v){return /^[a-zA-Z0-9_-]+\.webp$/.test(v||"")?"assets/"+v:"";}
function render(rows){
 const root=document.getElementById("menu-main");
 sections.forEach(section=>{
  const entries=rows.filter(r=>r.category===section.id).sort((a,b)=>(Number(a.sort)||0)-(Number(b.sort)||0));
  if(!entries.length)return;
  const block=document.createElement("section");block.id=section.id;
  block.innerHTML="<h2>"+section.title+"</h2><div class=\"en\">"+section.en+"</div>";
  const items=entries.filter(r=>r.type==="item");
  if(items.length){
   const grid=document.createElement("div");grid.className="grid";
   items.forEach(item=>{
    const img=safeImage(item.image);
    const holiday=yen(item.holiday_price);
    const card=document.createElement("article");card.className="card";
    card.innerHTML=(img?"<img src=\""+img+"\" alt=\""+esc(item.name)+"\">":"")+
      "<h3>"+esc(item.name)+"</h3><p class=\"desc\">"+esc(item.description)+"</p>"+
      "<div class=\"price\">"+(yen(item.price)?"税込 "+yen(item.price):"")+
      (holiday?"<br><small>土日祝 税込 "+holiday+"</small>":"")+"</div>";
    grid.appendChild(card);
   });
   block.appendChild(grid);
  }
  entries.filter(r=>r.type==="sheet").forEach(item=>{
   const img=safeImage(item.image);if(!img)return;
   const sheet=document.createElement("div");sheet.className="menu-sheet";
   sheet.innerHTML="<p class=\"sheet-title\">"+esc(item.name)+"</p><img loading=\"lazy\" src=\""+img+"\" alt=\""+esc(item.name)+"\">";
   block.appendChild(sheet);
  });
  entries.filter(r=>r.type==="note"&&r.description).forEach(item=>{
   const note=document.createElement("p");note.className="note";note.textContent=item.description;block.appendChild(note);
  });
  root.appendChild(block);
 });
}
fetch("menu-data.csv", {cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("CSV load failed");return r.text();})
.then(text=>render(parseCSV(text))).catch(()=>{
 document.getElementById("load-error").hidden=false;
});
</script>
</body>
</html>
